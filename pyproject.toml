[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nucb_transformer"
version = "0.1.0"
description = "Transformer-based sequence-to-activity classifier for NucB nuclease variants"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.2.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "pyyaml>=6.0.1",
    "biopython>=1.83",
    "scipy>=1.12.0",
    "statsmodels>=0.14.0",
    "nuclease_design @ git+https://github.com/google-deepmind/nuclease_design.git",

]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "jupyter>=1.0.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "wandb>=0.16.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["nucb_transformer*"]
